services:
  go-api:
    build:
      context: ./go-api
      dockerfile: Dockerfile
    container_name: go-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_API_URL=http://node-api:3000
    env_file:
      - go-api/.env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      node-api:
        condition: service_healthy
    networks:
      - interseguro-net

  node-api:
    build:
      context: ./node-api
      dockerfile: Dockerfile
    container_name: node-api
    restart: unless-stopped
    env_file:
      - node-api/.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - interseguro-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      go-api:
        condition: service_healthy

networks:
  interseguro-net:
    driver: bridge
