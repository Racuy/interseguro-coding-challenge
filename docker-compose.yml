services:
  go-api:
    build:
      context: ./go-api
      dockerfile: Dockerfile
    container_name: go-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_API_URL=http://node-api:3000
    env_file:
      - go-api/.env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - node-api
    networks:
      - interseguro-net

  node-api:
    image: node:20-alpine
    container_name: node-api
    restart: unless-stopped
    command: ["sh", "-c", "echo 'node-api not implemented yet' && sleep infinity"]
    networks:
      - interseguro-net

networks:
  interseguro-net:
    driver: bridge
